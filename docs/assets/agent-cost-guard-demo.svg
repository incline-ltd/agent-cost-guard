<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Agent Cost Guard terminal demo</title>
  <desc id="description">A proposed Terraform apply command is checked locally and returns approval required before execution.</desc>
  <rect width="1200" height="560" rx="24" fill="#0d1117"/>
  <rect x="36" y="36" width="1128" height="488" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <circle cx="70" cy="70" r="7" fill="#ff7b72"/>
  <circle cx="94" cy="70" r="7" fill="#d29922"/>
  <circle cx="118" cy="70" r="7" fill="#3fb950"/>
  <text x="150" y="77" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">agent-cost-guard</text>

  <text x="76" y="142" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">$</text>
  <text x="104" y="142" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">agent-cost-guard inspect -- terraform apply</text>

  <text x="76" y="194" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">✓ Cost policy checked.</text>

  <rect x="76" y="230" width="1048" height="206" rx="12" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
  <text x="108" y="278" fill="#d29922" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700">APPROVAL REQUIRED</text>
  <text x="108" y="322" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Provider: Terraform-managed provider</text>
  <text x="108" y="354" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Resource: infrastructure changes</text>
  <text x="108" y="386" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Price: unknown until the plan and provider are reviewed</text>
  <text x="108" y="418" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">Reason code: terraform.apply</text>

  <text x="76" y="484" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">Local • deterministic • no telemetry • never executes the inspected command</text>
</svg>
